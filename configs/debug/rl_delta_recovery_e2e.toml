output_dir = "outputs/debug-rl-delta-recovery-e2e"
clean_output_dir = false
max_steps = 4
seq_len = 1024

[deployment]
num_train_gpus = 1
num_infer_gpus = 0
gpus_per_node = 4

[weight_broadcast]
type = "filesystem"
mode = "delta"
update_protocol = "stage_commit"
stage_transport = "streaming_upload"
background_stage = true
retain_all_deltas = true

[model]
name = "Qwen/Qwen3-0.6B"

[trainer.model]
impl = "hf"

[trainer.optim]
lr = 1e-5

[orchestrator]
batch_size = 1
group_size = 1
max_inflight_rollouts = 1

[orchestrator.client]
base_url = ["http://127.0.0.1:8001/v1", "http://127.0.0.1:8002/v1"]
admin_base_url = ["http://127.0.0.1:8001", "http://127.0.0.1:8012"]
lease_enabled = true
lease_cooldown_s = 0.0
lease_recovery_enabled = true
lease_recovery_poll_interval_s = 1.0

[orchestrator.advantage]
type = "custom"
import_path = "prime_rl.orchestrator.debug_advantages.constant_advantage"
kwargs = { value = 1.0 }

[orchestrator.train.sampling]
max_completion_tokens = 16

[[orchestrator.train.env]]
id = "alphabet-sort"
name = "alphabet-sort"
args = { min_turns = 1, max_turns = 1, min_names_per_turn = 1, max_names_per_turn = 2, similarity_power = 2, power_per_turn = false }

[orchestrator.renderer]
name = "default"
